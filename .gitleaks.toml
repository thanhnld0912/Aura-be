# Secret scanning config, kept in the repo so the scan is reproducible locally and
# in CI rather than depending on an action's defaults. Any key that has ever touched
# a commit is treated as compromised and rotated, not un-committed (SECURITY.md §1).

[extend]
useDefault = true

[allowlist]
description = "Known non-secrets."
paths = [
  # Variable names with empty values only.
  '''\.env\.example$''',
]
regexes = [
  # A fixed HS256 signing key used by the test suite to mint tokens the real verifier
  # accepts (server/tests/helpers/app.ts). Allowlisted by exact value rather than by
  # path, because gitleaks scans history and the inline `gitleaks:allow` comments only
  # apply from the commit that added them. Nothing else in a test file is exempt.
  '''a-test-jwt-secret-that-is-long-enough-for-hs256''',
  '''a-different-secret-entirely-not-the-real-one''',
]
