name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Lockfiles are committed on both sides, so `npm ci` is reproducible (SECURITY.md §10).
env:
  NODE_VERSION: '22'

jobs:
  server:
    name: server — typecheck · migrate · test · build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aura_test
      # Opts the database-backed integration tests in; they skip without it.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aura_test
      CORS_ORIGIN: http://localhost:3000

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Toolchain versions
        run: node --version && npm --version

      # Runs before npm ci: a lockfile that is not cross-platform installable
      # should say so, not surface as EBADPLATFORM halfway through an install.
      - name: Lockfile integrity
        run: npm run check:lockfile

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Apply migrations to a fresh database
        run: npm run db:migrate

      - name: Migrations are idempotent on re-run
        run: npm run db:migrate

      - name: Test
        run: npm test

      # A skipped test reports as a passing run. The database-backed tests are gated
      # on TEST_DATABASE_URL so the suite runs without Docker locally — in CI they
      # must actually execute, or green means nothing for the database layer.
      - name: Database-backed tests must not skip
        run: |
          npx vitest run tests/integration/database.test.ts --reporter=json --outputFile="$RUNNER_TEMP/vitest-db.json"
          node scripts/assert-tests-ran.mjs "$RUNNER_TEMP/vitest-db.json" 5

      - name: Build
        run: npm run build

  security:
    name: security — audit · secret scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, not just the tip.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Lockfile integrity
        run: npm run check:lockfile
        working-directory: server

      - run: npm ci
        working-directory: server

      - name: npm audit (fails on high/critical)
        run: npm audit --audit-level=high
        working-directory: server

      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --redact --verbose --exit-code 1
