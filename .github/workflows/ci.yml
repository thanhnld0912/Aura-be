name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Lockfiles are committed on both sides, so `npm ci` is reproducible (SECURITY.md §10).
env:
  NODE_VERSION: '22'

jobs:
  server:
    name: server — typecheck · migrate · test · build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aura_test
      # Opts the database-backed integration tests in; they skip without it.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aura_test
      CORS_ORIGIN: http://localhost:3000

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Toolchain versions
        run: node --version && npm --version

      # Runs before npm ci: a lockfile that is not cross-platform installable
      # should say so, not surface as EBADPLATFORM halfway through an install.
      - name: Lockfile integrity
        run: npm run check:lockfile

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Apply migrations to a fresh database
        run: npm run db:migrate

      - name: Migrations are idempotent on re-run
        run: npm run db:migrate

      # Reference data loads from a clean database, and loads again without duplicating.
      - name: Seed the Vietnamese food dataset
        run: npm run db:seed

      - name: Seeding is idempotent on re-run
        run: npm run db:seed

      # A skipped test reports as a passing run. Large parts of the suite are gated on
      # TEST_DATABASE_URL so it stays runnable without Docker locally — in CI every one
      # of them must execute, or green says nothing about the database layer, RLS or
      # ownership. One run, then assert over its report.
      - name: Test
        run: npm test -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest.json"

      - name: No test may skip in CI
        run: node scripts/assert-tests-ran.mjs "$RUNNER_TEMP/vitest.json" 150

      - name: Build
        run: npm run build

  # The half of the contract loop neither repository can check alone. AURA-FE's
  # `check:api` proves its generated types match its vendored openapi.json; only a job
  # that can see both trees can prove that snapshot still matches this backend.
  #
  # Needs no Postgres service, no secrets and no network: the document comes from
  # building the app in memory, and building it touches neither.
  contract:
    name: contract — OpenAPI matches the AURA-FE snapshot
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check out AURA-FE for its vendored contract
        uses: actions/checkout@v4
        with:
          repository: thanhnld0912/Aura-fe
          path: aura-fe
          # Only required while Aura-fe is private; a public repository needs none,
          # and the fallback keeps this job working either way.
          token: ${{ secrets.AURA_FE_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Lockfile integrity
        run: npm run check:lockfile
        working-directory: server

      - run: npm ci
        working-directory: server

      # Emits the document and byte-compares it. Never writes to the snapshot: a
      # refresh is a change the frontend commits, not something CI does behind anyone.
      - name: Contract drift
        run: npm run check:contract
        working-directory: server
        env:
          AURA_FE_OPENAPI: ${{ github.workspace }}/aura-fe/openapi.json

  security:
    name: security — audit · secret scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, not just the tip.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Lockfile integrity
        run: npm run check:lockfile
        working-directory: server

      - run: npm ci
        working-directory: server

      - name: npm audit (fails on high/critical)
        run: npm audit --audit-level=high
        working-directory: server

      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --redact --verbose --exit-code 1
