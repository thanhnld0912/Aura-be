# Local Postgres only. The API runs on the host under `npm run dev` for fast reload
# (DEPLOYMENT.md §4) — there is no app service here on purpose.
services:
  db:
    image: postgres:16-alpine
    container_name: aura-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aura
    ports:
      - '5432:5432'
    volumes:
      - aura-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d aura']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aura-pgdata:
